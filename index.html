          <a class="icon-button cart-button" href="#cart" aria-label="سبد خرید">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M3.5 4.5h2l1.8 10.1a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 1.9-1.5l1.3-6.3H6.1"

              <circle cx="17.2" cy="19.2" r="1.1" />

            <span class="cart-count" aria-label="۰ محصول">۰</span>
          </a>

          <a class="icon-button" href="#search" aria-label="جست‌وجو">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="10.8" cy="10.8" r="6.2" />

        <!-- لوگو سمت راست -->
        <a class="brand" href="#home" aria-label="آرسا، صفحه اصلی">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="110 20 1780 700"
            role="img"
            aria-labelledby="arisaTitle arisaDesc"
          >
            <title id="arisaTitle">لوگوی آریسا</title>
            <desc id="arisaDesc">
              لوگوی سبز آریسا با برگ‌های تزئینی و تاج طلایی
            </desc>

            <defs>
              <!-- Green Gradient -->
              <linearGradient id="arisaGreen" x1="0" y1="0" x2="0.25" y2="1">
                <stop offset="0" stop-color="#39784a" />
                <stop offset="0.24" stop-color="#0e5630" />
                <stop offset="0.62" stop-color="#064023" />
                <stop offset="1" stop-color="#012a17" />
              </linearGradient>

              <!-- Gold Gradient -->
              <linearGradient id="arisaGold" x1="0" y1="0" x2="0.2" y2="1">
                <stop offset="0" stop-color="#fff1a2" />
                <stop offset="0.22" stop-color="#f6c44e" />
                <stop offset="0.48" stop-color="#b87513" />
                <stop offset="0.72" stop-color="#ffe18a" />
                <stop offset="1" stop-color="#8e4d08" />
              </linearGradient>

              <!-- Green Shadow -->
              <filter
                id="greenShadow"
                x="-10%"
                y="-15%"
                width="120%"
                height="140%"
              >
                <feGaussianBlur
                  in="SourceAlpha"
                  stdDeviation="5"
                  result="blur"
                />
                <feOffset dy="5" result="offset" />
                <feComponentTransfer>
                  <feFuncA type="linear" slope=".42" />
                </feComponentTransfer>
                <feMerge>
                  <feMergeNode />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <!-- Gold Shadow -->
              <filter
                id="goldShadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="150%"
              >
                <feGaussianBlur
                  in="SourceAlpha"
                  stdDeviation="3"
                  result="blur"
                />
                <feOffset dy="3" result="offset" />
                <feComponentTransfer>
                  <feFuncA type="linear" slope=".35" />
                </feComponentTransfer>
                <feMerge>
                  <feMergeNode />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
